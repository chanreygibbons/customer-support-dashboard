<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Support Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
</head>
<body>
    <div class="dashboard-header">
        <h1>Customer Support Dashboard</h1>
        <div id="current-time"></div>
    </div>
    <div class="dashboard-cards">
        <div class="card">
            <h2>Average Response Time</h2>
            <div id="responseTime" class="metric">0.0 mins</div>
            <div id="responseTrend" class="trend"></div>
        </div>
        <div class="card">
            <h2>Customer Satisfaction</h2>
            <div id="satisfaction" class="metric">0%</div>
            <div id="satisfactionTrend" class="trend"></div>
        </div>
        <div class="card">
            <h2>Tickets Per Agent</h2>
            <div class="chart-container">
                <canvas id="ticketsChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Chart initialization and data update logic remains the same
        const ctx = document.getElementById('ticketsChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['John', 'Sarah', 'Mike', 'Emma', 'David'],
                datasets: [{
                    label: 'Tickets Handled',
                    data: [0, 0, 0, 0, 0],
                    backgroundColor: '#2563eb',
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: {
                            display: true,
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        ticks: {
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            font: {
                                size: 11,
                                weight: '500'
                            }
                        }
                    }
                },
                animation: {
                    duration: 1000,
                    easing: 'easeInOutQuart'
                }
            }
        });

        // Function to update current time
        function updateTime() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString();
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Function to generate random data
        function generateData() {
            return {
                responseTime: (Math.random() * 15 + 5).toFixed(2),
                satisfaction: Math.floor(Math.random() * 30 + 70),
                ticketsPerAgent: Array.from({length: 5}, () => Math.floor(Math.random() * 20 + 10))
            };
        }

        // Function to update dashboard
        function updateDashboard() {
            const newData = generateData();
            
            // Update response time
            const responseTimeEl = document.getElementById('responseTime');
            const oldResponseTime = parseFloat(responseTimeEl.textContent);
            responseTimeEl.textContent = `${newData.responseTime} mins`;
            
            // Update response trend
            const responseTrendEl = document.getElementById('responseTrend');
            const responseDiff = newData.responseTime - oldResponseTime;
            responseTrendEl.textContent = `${Math.abs(responseDiff).toFixed(2)}mins ${responseDiff < 0 ? '↓' : '↑'}`;
            responseTrendEl.className = `trend ${responseDiff < 0 ? 'up' : 'down'}`;

            // Update satisfaction
            const satisfactionEl = document.getElementById('satisfaction');
            const oldSatisfaction = parseInt(satisfactionEl.textContent);
            satisfactionEl.textContent = `${newData.satisfaction}%`;
            
            // Update satisfaction trend
            const satisfactionTrendEl = document.getElementById('satisfactionTrend');
            const satisfactionDiff = newData.satisfaction - oldSatisfaction;
            satisfactionTrendEl.textContent = `${Math.abs(satisfactionDiff)}% ${satisfactionDiff > 0 ? '↑' : '↓'}`;
            satisfactionTrendEl.className = `trend ${satisfactionDiff > 0 ? 'up' : 'down'}`;

            // Update chart
            chart.data.datasets[0].data = newData.ticketsPerAgent;
            chart.update('none');
        }

        // Initial update
        updateDashboard();

        // Update every 3 seconds
        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
